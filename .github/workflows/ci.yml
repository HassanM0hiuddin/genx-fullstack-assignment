name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-webhook-assessment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -v -s

  frontend:
    name: Frontend type check and build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-stream-assessment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nextjs-stream-assessment/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
